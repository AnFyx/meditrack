<!DOCTYPE html>
<html xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<h:head>
	<meta charset="UTF-8" />
	<title>New Patient</title>
</h:head>

<h:body>
<f:view>
<h:form>

	<div class="card">
		<p:tabMenu activeIndex="#{param.i}">
			<p:menuitem value="Assigned Patients" outcome="patients.xhtml">
				<f:param name="i" value="0"/>
			</p:menuitem>
			<p:menuitem value="Unassigned Patients" outcome="unassigned_patients.xhtml">
				<f:param name="i" value="1"/>
			</p:menuitem>
			<p:menuitem value="Doctors" outcome="doctors.xhtml">
				<f:param name="i" value="2"/>
			</p:menuitem>
		</p:tabMenu>
	</div>

	<f:metadata>
		<f:viewParam name="email" value="#{DoctorBean.selectedEmail}" />
		<f:event type="preRenderView" listener="#{DoctorBean.init}" />
	</f:metadata>


	<br/>
<!--Name-->
	<span class="ui-float-label">
       <p:inputText id="name" value="#{DoctorBean.selectedDoctor.name}"/>
       <p:outputLabel for="@previous" value="Name"/>
   </span>

	<br/>
<!--Surname-->
	<span class="ui-float-label">
       <p:inputText id="surname" value="#{DoctorBean.selectedDoctor.surname}"/>
       <p:outputLabel for="@previous" value="Surname"/>
	</span>

	<br/>
<!--Birth Date-->
	<span class="ui-float-label">
    <p:datePicker id="birthDate"
				  value="#{DoctorBean.selectedDoctor.birthDate}"
				  monthNavigator="true"
				  yearNavigator="true"
				  required="true"
				  requiredMessage="Birth date is required."
				  converterMessage="Invalid date format. Please use YYYY-MM-DD.">
    </p:datePicker>

    <p:outputLabel for="@previous" value="Birth date"/>
    <p:message for="birthDate"/>
	</span>

	<br/>
<!--Mail-->
	<span class="ui-float-label">
    <p:inputText id="email" value="#{DoctorBean.selectedDoctor.email}" required="true" validatorMessage="Email must contain '@' and a valid domain (e.g., example@domain.com)">
        <f:validateRegex pattern="^.+@.+\..+$"/>
	</p:inputText>
    <p:outputLabel for="@previous" value="Email"/>
    <p:message for="email"/>
	</span>

	<br/>

<!--Max Patients-->
	<span class="ui-float-label">
	<p:selectOneMenu value="#{DoctorBean.selectedDoctor.maxPatients}">
		<f:selectItem itemLabel="Select" itemValue="" noSelectionOption="false" />
		<f:selectItems value="#{DoctorBean.maxOptions}" />
	</p:selectOneMenu>
	</span>

	<br/><br/>
	<p:commandButton value="Save" update="@form" action="#{DoctorBean.saveDoctor}" icon="pi pi-check"/>
	
</h:form>
</f:view>
</h:body>

</html>
